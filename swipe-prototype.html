<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1e8" />
  <title>Swipe Flag Prototype</title>
  <link rel="stylesheet" href="./src/swipe-prototype.css" />
</head>
<body>
  <main class="prototype-shell">
    <header>
      <p class="eyebrow">TOUCH PROTOTYPE</p>
      <h1>スワイプ旗 操作テスト</h1>
      <p class="lead">タップは開く。スワイプ方向だけで無色／色付きフラッグを置き分けます。長押しは使いません。</p>
    </header>

    <section class="controls" aria-label="テスト設定">
      <div class="segmented" id="color-control">
        <button type="button" data-colors="3" class="active">3色</button>
        <button type="button" data-colors="4">4色</button>
      </div>
      <label class="sensitivity">
        <span>スワイプ判定距離 <strong id="threshold-value">16px</strong></span>
        <input id="threshold" type="range" min="12" max="32" step="2" value="16" />
      </label>
      <button id="new-board" type="button" class="new-board">新しい盤面</button>
    </section>

    <section class="gesture-card" aria-label="操作方法">
      <div class="gesture-grid">
        <span class="red">↖ 赤</span>
        <span class="neutral">↑ 無色</span>
        <span class="blue">青 ↗</span>
        <span class="green">↙ 緑</span>
        <span class="tap">タップ<br><b>開く</b></span>
        <span class="yellow">黄 ↘</span>
      </div>
      <p>同じ方向でもう一度スワイプすると解除。別方向なら色を直接変更します。方向は判定距離に最初に到達した時点で固定します。</p>
    </section>

    <section class="play-card">
      <div class="status-row">
        <span id="status">最初のマスをタップしてください</span>
        <span id="flag-count">旗 0 / 20</span>
      </div>
      <div class="feedback" id="gesture-feedback" aria-live="polite">指を置いて、そのままタップまたはスワイプ</div>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="9×9盤面"></div>
      </div>
      <p class="hint">16px到達時の序盤方向で判定を固定します。判定が敏感／鈍いと感じたら距離を変えて試してください。</p>
    </section>
  </main>

  <script type="module" src="./src/swipe-prototype.js"></script>
</body>
</html>
