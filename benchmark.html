<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No-Guess Generator Browser Benchmark</title>
    <style>
      body { max-width: 1100px; margin: 32px auto; padding: 0 16px; font-family: system-ui, sans-serif; color: #182030; }
      .controls { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
      input { width: 70px; padding: 8px; }
      button { padding: 9px 16px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { border: 1px solid #ccd2dc; padding: 8px; text-align: right; }
      th:first-child { text-align: left; }
      pre { overflow: auto; padding: 12px; background: #f3f5f8; }
    </style>
  </head>
  <body>
    <h1>No-Guess Generator Browser Benchmark</h1>
    <p>20爆弾、条件A〜D、中央・中央付近・辺・角・ランダム初手をWeb Worker内で測定します。</p>
    <div class="controls">
      <label>各条件・初手の回数 <input id="runs" type="number" min="1" max="100" value="10" /></label>
      <button id="run-benchmark" type="button">測定開始</button>
      <span id="benchmark-status">待機中</span>
    </div>
    <div id="benchmark-output"></div>
    <script type="module" src="./src/benchmark-ui.js"></script>
  </body>
</html>
